version: '3.7'

include:
  - docker-compose-deps-postgres.yml

services:

  # ---------------------
  # HawkBit DB Init
  # ---------------------
  hawkbit-db-init:
    image: "hawkbit/hawkbit-repository-jpa-init:latest"
    environment:
      - 'HAWKBIT_DB_MODE=migrate'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hawkbit'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=admin'
      - 'AND_THEN=sleep infinity'
    restart: always
    healthcheck:
      test: [ "CMD", "pgrep", "sleep" ]
      start_period: 30s
      interval: 10s
      retries: 5
      timeout: 60s
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      NAME: "hawkbit-db-init"

  # ---------------------
  # HawkBit DDI
  # ---------------------
  hawkbit-ddi:
    image: "hawkbit/hawkbit-ddi-server:latest"
    environment:
      - 'PROFILES=postgresql'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hawkbit'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=admin'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_USERNAME=guest'
      - 'SPRING_RABBITMQ_PASSWORD=guest'
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      hawkbit-db-init:
        condition: service_healthy
    labels:
      NAME: "hawkbit-ddi"
    volumes:
      - artifactrepo:/app/artifactrepo

  # ---------------------
  # HawkBit DMF
  # ---------------------
  # Not started by default - start with "--profile dmf" (hawkbit.dmf.deployment-model must be set, see
  # https://github.com/eclipse-hawkbit/hawkbit/blob/master/docs/device-management-federation-api.md#deployment-models)
  hawkbit-dmf:
    image: "hawkbit/hawkbit-dmf-server:latest"
    profiles: [ dmf ]
    environment:
      - 'PROFILES=postgresql'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hawkbit'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=admin'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_USERNAME=guest'
      - 'SPRING_RABBITMQ_PASSWORD=guest'
      # set to DM_SERVER_FOR_ALL only if your DM server is trusted for any tenant (see the deployment models doc above)
      - 'HAWKBIT_DMF_DEPLOYMENTMODEL=${HAWKBIT_DMF_DEPLOYMENTMODEL:-}'
    restart: always
    depends_on:
      hawkbit-db-init:
        condition: service_healthy
    labels:
      NAME: "hawkbit-dmf"

  # ---------------------
  # HawkBit MGMT
  # ---------------------
  hawkbit-mgmt:
    image: "hawkbit/hawkbit-mgmt-server:latest"
    environment:
      - 'PROFILES=postgresql'
      - 'SPRING_FLYWAY_ENABLED=false'
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hawkbit'
      - 'SPRING_DATASOURCE_USERNAME=postgres'
      - 'SPRING_DATASOURCE_PASSWORD=admin'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_USERNAME=guest'
      - 'SPRING_RABBITMQ_PASSWORD=guest'
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      hawkbit-db-init:
        condition: service_healthy
    labels:
      NAME: "hawkbit-mgmt"
    volumes:
      - artifactrepo:/app/artifactrepo

volumes:
  artifactrepo:
    driver: local
