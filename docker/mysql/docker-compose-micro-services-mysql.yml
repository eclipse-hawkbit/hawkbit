version: '3.7'

include:
  - docker-compose-deps-mysql.yml

services:

  # ---------------------
  # HawkBit DDI
  # ---------------------
  hawkbit-ddi:
    image: "hawkbit/hawkbit-ddi-server:latest"
    environment:
      - 'PROFILES=mysql'
      - 'SPRING_DATASOURCE_URL=jdbc:mariadb://mysql:3306/hawkbit'
      - 'SPRING_DATASOURCE_USERNAME=root'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_USERNAME=guest'
      - 'SPRING_RABBITMQ_PASSWORD=guest'
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      NAME: "hawkbit-ddi"
    volumes:
      - artifactrepo:/app/artifactrepo

  # ---------------------
  # HawkBit DMF
  # ---------------------
  # hawkbit.dmf.deployment-model shall be set (otherwise a warning is logged, starting with 1.2.0 the startup fails), see
  # https://github.com/eclipse-hawkbit/hawkbit/blob/master/docs/device-management-federation-api.md#deployment-models
  hawkbit-dmf:
    image: "hawkbit/hawkbit-dmf-server:latest"
    environment:
      - 'PROFILES=mysql'
      - 'SPRING_DATASOURCE_URL=jdbc:mariadb://mysql:3306/hawkbit'
      - 'SPRING_DATASOURCE_USERNAME=root'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_USERNAME=guest'
      - 'SPRING_RABBITMQ_PASSWORD=guest'
      # set to DM_SERVER_FOR_ALL only if your DM server is trusted for any tenant (see the deployment models doc above)
      - 'HAWKBIT_DMF_DEPLOYMENTMODEL=${HAWKBIT_DMF_DEPLOYMENTMODEL:-}'
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      NAME: "hawkbit-dmf"

  # ---------------------
  # HawkBit MGMT
  # ---------------------
  hawkbit-mgmt:
    image: "hawkbit/hawkbit-mgmt-server:latest"
    environment:
      - 'PROFILES=mysql'
      - 'SPRING_DATASOURCE_URL=jdbc:mariadb://mysql:3306/hawkbit'
      - 'SPRING_DATASOURCE_USERNAME=root'
      - 'SPRING_RABBITMQ_HOST=rabbitmq'
      - 'SPRING_RABBITMQ_USERNAME=guest'
      - 'SPRING_RABBITMQ_PASSWORD=guest'
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    labels:
      NAME: "hawkbit-mgmt"
    volumes:
      - artifactrepo:/app/artifactrepo

volumes:
  artifactrepo:
    driver: local
