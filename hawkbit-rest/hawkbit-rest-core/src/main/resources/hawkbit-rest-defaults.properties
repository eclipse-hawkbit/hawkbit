# DDI and download security
hawkbit.server.ddi.security.authentication.header.enabled=false
hawkbit.server.ddi.security.authentication.header.authority=
hawkbit.server.ddi.security.authentication.targettoken.enabled=false
hawkbit.server.ddi.security.authentication.gatewaytoken.enabled=false
hawkbit.server.ddi.security.authentication.gatewaytoken.key=

# hawkBit runs behind a reverse proxy and is designed for embedded Tomcat with these settings (see docs/throttling.md):
# Tomcat's RemoteIpValve resolves the client IP from X-Forwarded-For only if the request comes from a trusted proxy
# (server.tomcat.remoteip.internal-proxies, by default private / loopback addresses) and redirects don't contain the host
server.forward-headers-strategy=NATIVE
server.tomcat.use-relative-redirects=true
