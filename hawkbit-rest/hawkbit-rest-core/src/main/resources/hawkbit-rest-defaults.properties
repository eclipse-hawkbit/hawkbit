# DDI and download security
hawkbit.server.ddi.security.authentication.header.enabled=false
hawkbit.server.ddi.security.authentication.header.authority=
hawkbit.server.ddi.security.authentication.targettoken.enabled=false
hawkbit.server.ddi.security.authentication.gatewaytoken.enabled=false
hawkbit.server.ddi.security.authentication.gatewaytoken.key=

# hawkBit runs behind a reverse proxy and processes the forwarded headers by itself (see docs/throttling.md): the client IP
# (and scheme, host, port) is resolved from X-Forwarded-For only for trusted proxies (hawkbit.server.security.forwarded.*,
# by default private / loopback addresses). Another forward headers strategy (e.g. NATIVE) switches to the legacy mode -
# the client IP is read from hawkbit.server.security.clients.remote-ip-header as is. Redirects don't contain the host
server.forward-headers-strategy=NONE
server.tomcat.use-relative-redirects=true
