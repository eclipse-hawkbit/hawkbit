name: Style Check

on:
  # push on master also saves the IntelliJ IDEA cache in the master scope - PR runs can restore only caches of
  # their own ref or of the base branch, so without it every new PR would download IDEA again
  push:
    branches:
      - master
    paths-ignore:
      - '.3rd-party/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.3rd-party/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  # keep in sync with the IntelliJ IDEA version used locally for formatting (see CONTRIBUTING.md)
  IDEA_VERSION: '2026.2.3'
  IDEA_SHA256: '68751c8ae4d49407251cd197df795fbed91b6fdc85d10c73c4649a99e496ab37'

jobs:
  style_check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # spotless formats with IntelliJ IDEA ('idea' step), so a pinned IDEA is installed (and cached).
      # 'idea format' runs headless; spotless sets its own idea config/system dirs under target/.
      # restore / save are separate steps - actions/cache saves only when the job succeeds, but the job fails on
      # style violations and IDEA shall be cached anyway
      - name: Restore IntelliJ IDEA
        id: cache-idea
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/idea
          key: idea-${{ env.IDEA_VERSION }}-linux

      - name: Install IntelliJ IDEA
        if: steps.cache-idea.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/idea"
          curl -fsSL -o "$RUNNER_TEMP/idea.tar.gz" "https://download.jetbrains.com/idea/idea-${IDEA_VERSION}.tar.gz"
          echo "${IDEA_SHA256}  $RUNNER_TEMP/idea.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/idea.tar.gz" -C "$RUNNER_TEMP/idea" --strip-components=1
          rm "$RUNNER_TEMP/idea.tar.gz"

      - name: Save IntelliJ IDEA
        if: steps.cache-idea.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/idea
          key: idea-${{ env.IDEA_VERSION }}-linux

      - name: Check code style
        env:
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.clone_url }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # only the files changed since the base are checked (spotless ratchet)
          if [ -n "$PR_BASE_SHA" ]; then
            # pull request - compare to the target branch
            git remote add target "$PR_BASE_REPO"
            git fetch target
            BASE="$PR_BASE_SHA"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # push - compare to the commit before the push
            git fetch --depth=1 origin "$PUSH_BEFORE"
            BASE="$PUSH_BEFORE"
          else
            # manual run - compare to the previous commit
            git fetch --deepen=1 origin
            BASE="HEAD~1"
          fi
          echo "RATCHET_BASE=$BASE" >> "$GITHUB_ENV"
          mvn spotless:check -DratchetFrom="$BASE" -Dspotless.idea.binary="$RUNNER_TEMP/idea/bin/idea.sh"

      # spotless:check lists at most 10 files / 50 diff lines per module (hard-coded) - on failure apply the formatting
      # in the CI workspace and print / upload the complete diff (apply it locally with 'git apply spotless.patch')
      - name: Print all style violations
        if: failure() && env.RATCHET_BASE != ''
        run: |
          mvn -q spotless:apply -DratchetFrom="$RATCHET_BASE" -Dspotless.idea.binary="$RUNNER_TEMP/idea/bin/idea.sh"
          git diff > spotless.patch
          git --no-pager diff --stat
          git --no-pager diff

      - name: Upload style violations patch
        if: failure() && env.RATCHET_BASE != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: spotless.patch
          path: spotless.patch
          if-no-files-found: ignore
