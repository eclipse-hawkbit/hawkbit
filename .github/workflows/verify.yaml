name: Verify

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.3rd-party/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.3rd-party/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/reusable_workflow_verify.yaml
