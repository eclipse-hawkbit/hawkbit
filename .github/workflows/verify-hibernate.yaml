name: Verify (Hibernate)

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.3rd-party/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - '.3rd-party/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hibernate:
    uses: ./.github/workflows/reusable_workflow_verify.yaml
    with:
      maven_properties: '-Djpa.vendor=hibernate -Dlogging.level.org.hibernate.orm.collection=ERROR -Dlogging.level.org.hibernate.collection.spi.AbstractPersistentCollection=ERROR'
