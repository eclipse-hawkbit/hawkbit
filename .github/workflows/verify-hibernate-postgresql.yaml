name: Verify (Hibernate + PostgreSQL)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hibernate-postgresql:
    uses: ./.github/workflows/reusable_workflow_verify.yaml
    with:
      maven_properties: '-Djpa.vendor=hibernate -Dlogging.level.org.hibernate.orm.collection=ERROR -Dlogging.level.org.hibernate.collection.spi.AbstractPersistentCollection=ERROR -Dspring.jpa.database=POSTGRESQL -Dspring.datasource.url=jdbc:postgresql://localhost:5432/hawkbit -Dspring.datasource.username=postgres -Dspring.datasource.password=admin'
